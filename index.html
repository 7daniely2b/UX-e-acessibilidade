<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu de Acessibilidade</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <nav class="menu-acessibilidade" aria-label="Menu de Acessibilidade">
    <button id="botao-aumentar-fonte" class="botao-acessibilidade" title="Aumentar tamanho do texto">
      <span aria-hidden="true">A+</span> Aumentar
    </button>
    <button id="botao-diminuir-fonte" class="botao-acessibilidade" title="Diminuir tamanho do texto">
      <span aria-hidden="true">A-</span> Diminuir
    </button>
    <button id="botao-ler-texto" class="botao-acessibilidade" title="Ouvir leitura da página">
      <span aria-hidden="true">🔊</span> Ouvir Página
    </button>
    <button id="botao-parar-texto" class="botao-acessibilidade botao-perigo" title="Parar leitura">
      <span aria-hidden="true">⏹️</span> Parar
    </button>
  </nav>

  <main id="conteudo-principal">
    <h1>Acessibilidade na Web</h1>
    <p>A acessibilidade web permite que pessoas com diferentes capacidades possam navegar, compreender e interagir com a rede de forma autônoma.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
